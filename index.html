
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Componente Interactivo de Calificación</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <main class="container">
        <section class="rating-card">
            <div class="rating-selection">
                <h2>Califica nuestro servicio</h2>
                <p>Selecciona una calificación:</p>
                <div class="ratings">
                    <button class="rating-btn" data-value="1">1</button>
                    <button class="rating-btn" data-value="2">2</button>
                    <button class="rating-btn" data-value="3">3</button>
                    <button class="rating-btn" data-value="4">4</button>
                    <button class="rating-btn" data-value="5">5</button>
                </div>
                <button id="submit-btn" disabled>Enviar</button>
            </div>
            <div class="thank-you-message hidden">
                <h2>¡Gracias por tu calificación!</h2>
                <p>Has seleccionado la calificación: <span id="selected-rating"></span></p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
